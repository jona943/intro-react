<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Clone - Portal</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: rgba(22, 24, 28, 0.6);
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 3rem; margin-bottom: 1rem; color: #ff6600; }
        p { color: #71767b; margin-bottom: 2rem; }
        .links { display: flex; gap: 1rem; justify-content: center; }
        a {
            padding: 1rem 2rem;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary { background: #ff6600; color: #fff; }
        .btn-secondary { border: 1px solid #71767b; color: #71767b; }
        a:hover { transform: translateY(-2px); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>𝕏 Clone</h1>
        <p>Selecciona la versión que deseas visualizar:</p>
        <div class="links">
            <a href="demo/index.html" class="btn-primary">Versión Estática (Vanilla JS)</a>
            <a href="cloneTwitter/index.html" class="btn-secondary">Versión React (Vite)</a>
        </div>
    </div>
</body>
</html>
